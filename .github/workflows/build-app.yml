# Builds FB Clip Maker for Windows and macOS (Apple Silicon).
# Every push: downloadable zips under the run's "Artifacts". Pushing a tag like v1.0: also a GitHub Release.
name: build-app
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -q --upgrade pip
          .venv\Scripts\python -m pip install -q -r packaging\requirements-app.txt
          .venv\Scripts\python setup_helper.py
      - name: Build + selftest
        shell: cmd
        run: packaging\build_app.bat
      - uses: actions/upload-artifact@v4
        with: {name: FBClipMaker-Windows, path: dist/FBClipMaker-Windows.zip, compression-level: 0}

  macos:
    runs-on: macos-15     # Apple Silicon; app still targets macOS 12+ (LSMinimumSystemVersion)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Build + selftest
        run: bash packaging/build_app.sh
      - uses: actions/upload-artifact@v4
        with: {name: FBClipMaker-macOS, path: dist/FBClipMaker-macOS.zip, compression-level: 0}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: "out/*.zip"}
